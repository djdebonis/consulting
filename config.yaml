      date: "June 2021 - August 2021"
      info:
        enable: true
      featuredLink:
        enable: true
        name: "Learn More"
        url: "https://medschool.cuanschutz.edu/dbmi"
        content: |
         Communicate biomedical informatics, clinical informatics, and artificial intelligence research for public and professional audiences
         Write and edit newsroom articles, blog posts, web content, and social media communications that translate complex research into clear stories
         Collaborate with researchers, healthcare workers, and scientists to explain technical work without losing its meaning or rigor
         Support research initiatives, events, and programs through editorial planning, visual communication, and digital publishing
         Lead the DBMI Wall of Software (WOS) promotional initiative, highlighting research tools and their applications across channels
         
    - job: "Director of E-Commerce Operations and Product Education"
      company: "Nano Bella"
      companyUrl: "https://nanobella.com"
      date: "Oct 2021 - July 2024"
      featuredLink:
        enable: true
        name: "View Project"
        url: "https://nanobella.com"
      content: |
        Supported the development of new initiatives in science-backed health product, emphasizing Direct to Consumer (DTC)
        marketing and project education efforts. Led initiatives in web development, product education, email marketing, and more.

    - job: "Research Assistant"
      company: "CU Denver Modern Languages"
      companyUrl: "https://symposium.foragerone.com/2023-summer/presentations/58498"
      date: "Sep 2020 - Dec 2021"
      featuredLink:
        enable: true
        name: "View the Project"
        url: "https://symposium.foragerone.com/2023-summer/presentations/58498"
      info:
        enable: true
      content: |
        Researched prescriptive and descriptive phonetics in Spanish language acquisition;
        transcribed audio recordings into the International Phonetic Alphabet (IPA) leveraging Praat;
        wrote python code for string parsing, sequence matching, and comparative data analysis;
        explored the role of language transfer, as well as explicit instruction in phonemic/phonetic acquisition in L1 English L2 Spanish speakers.

    - job: "Professional Writing Consultant"
      company: "CU Denver Writing Center"
      companyUrl: "https://clas.ucdenver.edu/writing-center/"
      date: "Aug 2018 - June 2021"
      info:
        enable: true
      featuredLink:
        enable: false
        url: "https://clas.ucdenver.edu/writing-center/"
      content: |
        Taught English writing to cross-disciplinary university students;
        consulted on writing across diverse genres (e.g. résumés, personal statements, literature reviews, dissertations);
        developed teacher-training and professional development materials;
        specialized in second language [writing] acquisition.

 


