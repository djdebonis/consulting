{{ define "main" }}
<div class="container">
    <div class="row">
        <div class="col-12">
            <h1>{{ .Title }}</h1>
            {{ .Content | emojify }}
        </div>
    </div>
    <div class="card-group p-4">
        <div class="row justify-content-center">
            {{ range .Params.galleryImages }}
            <div class="col-md-4 p-0 m-0">
                <div class="card p-0 m-0 border-0">
                    <img class="w-100" height="280px" src="{{ .src }}" alt="{{ .alt | default "Gallery image" }}">
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</div>
{{ end }}
